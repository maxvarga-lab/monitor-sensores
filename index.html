<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor biometrivco</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Monitor de sensor Biometricos </h1>

    <div class="contenedor tarjetas">
        <div class="tarjeta ecg">
            <h2>ECG</h2>
            <p class="Subtitulo">Electrocardiograma</p>
            <p class=" valor"><span id="ecg-val">--</span><small>BMP</small></p>
            </div>

        <div class="tarjeta emg">
            <h2>EMG</h2>
            <p class="Subtitulo">Electromiografia</p>
            <p class="valor"><span id="emg-val">--</span><small>μV</small></p>
        </div>
        <div class="tarjeta gsr">
            <h2>GSR</h2>
            <p class=" Subtitulo">Respuesta Galvanica</p>
            <p class="valor"><span id="gsr-val">--</span><small>μS</small></p>
        </div>
    </div>

    <script type="module" src="script.js"> </script>
</body>
</html>
